const spriteCache = new Map();
function spriteCanvas(matrix, scale=1){
  const key = matrix.join("|")+"@"+scale;
  if(spriteCache.has(key)) return spriteCache.get(key);
  const h=matrix.length, w=matrix[0].length;
  const c=document.createElement("canvas");
  c.width=w*scale; c.height=h*scale;
  const g=c.getContext("2d"); g.imageSmoothingEnabled=false;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ch=matrix[y][x];
    if(ch==="." || !PAL[ch]) continue;
    g.fillStyle=PAL[ch];
    g.fillRect(x*scale,y*scale,scale,scale);
  }
  spriteCache.set(key,c);
  return c;
}
function drawSprite(matrix,x,y,scale=2,flip=false,alpha=1){
  const s=spriteCanvas(matrix,scale);
  ctx.save();
  ctx.globalAlpha=alpha;
  if(flip){ctx.translate(Math.round(x)+s.width,Math.round(y));ctx.scale(-1,1);ctx.drawImage(s,0,0);}
  else ctx.drawImage(s,Math.round(x),Math.round(y));
  ctx.restore();
}

function textPx(str,x,y,scale=1,color=PAL["7"],align="left"){
  str=String(str).toUpperCase();
  const w=str.length*4*scale;
  if(align==="center") x-=w/2;
  if(align==="right") x-=w;
  ctx.fillStyle=color;
  for(let i=0;i<str.length;i++){
    const m=FONT[str[i]]||FONT[" "];

      if(m[yy][xx]==="1") ctx.fillRect(Math.round(x+(i*4+xx)*scale),Math.round(y+yy*scale),scale,scale);

  }
}

function hazardStripes(x,y,w,h,dir=1){
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle=PAL["0"];ctx.fillRect(x,y,w,h);
  const step=6;
  for(let i=-h;i<w+h;i+=step){
    ctx.fillStyle=(Math.floor(i/step)%2===0)?PAL["J"]:PAL["0"];
    ctx.beginPath();
    ctx.moveTo(x+i,y);ctx.lineTo(x+i+h*dir,y+h);ctx.lineTo(x+i+step+h*dir,y+h);ctx.lineTo(x+i+step,y);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawPanel(x,y,w,h,accent=PAL["I"]){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  ctx.fillStyle=PAL["0"];ctx.fillRect(x,y,w,h);
  ctx.fillStyle=PAL["1"];ctx.fillRect(x,y,w,1);
  ctx.fillStyle=accent;ctx.fillRect(x,y+h-2,w,2);
  ctx.fillStyle=PAL["M"];
  ctx.fillRect(x+2,y+1,1,1);ctx.fillRect(x+w-3,y+1,1,1);
}
function cornerBracket(x,y,w,h,color=PAL["6"],len=6){
  x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  ctx.fillStyle=color;
  ctx.fillRect(x,y,len,1);ctx.fillRect(x,y,1,len);
  ctx.fillRect(x+w-len,y,len,1);ctx.fillRect(x+w-1,y,1,len);
  ctx.fillRect(x,y+h-1,len,1);ctx.fillRect(x,y+h-len,1,len);
  ctx.fillRect(x+w-len,y+h-1,len,1);ctx.fillRect(x+w-1,y+h-len,1,len);
}

function gamepadState(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  const p=pads&&pads[0];
  if(!p) return null;
  return {
    l:p.axes[0]<-0.35, r:p.axes[0]>0.35, u:p.axes[1]<-0.45, d:p.axes[1]>0.45,
    fire:!!p.buttons[0]?.pressed, jump:!!p.buttons[1]?.pressed,
    nade:!!p.buttons[2]?.pressed, knife:!!p.buttons[3]?.pressed
  };
}

/* ============================================================
   AUDIO WEB AUDIO — SFX + LOOP MILITAR
   ============================================================ */
let audio=null, master=null, beat=0, beatStep=0;
function initAudio(){
  if(audio) return;
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain(); master.gain.value=0.24; master.connect(audio.destination);
}
function tone(freq,dur,type="square",vol=0.25,slide=0){
  if(!audio) return;
  const o=audio.createOscillator(), g=audio.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,audio.currentTime);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),audio.currentTime+dur);
  g.gain.setValueAtTime(vol,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(audio.currentTime+dur);
}
function noise(dur=0.08,vol=0.2){
  if(!audio) return;
  const n=Math.floor(audio.sampleRate*dur), b=audio.createBuffer(1,n,audio.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=audio.createBufferSource(),g=audio.createGain();
  s.buffer=b; g.gain.setValueAtTime(vol,audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+dur);
  s.connect(g); g.connect(master); s.start();
}
const SFX={
  shot(){tone(190,0.05,"square",0.12,-60);},
  shotgun(){noise(0.10,0.3);tone(100,0.08,"square",0.12,-40);},

  knife(){noise(0.04,0.12);tone(440,0.05,"square",0.08,-120);},
  pickup(){tone(520,0.06,"square",0.1,140); setTimeout(()=>tone(720,0.08,"square",0.08,80),55);},
  boss(){tone(55,0.35,"sawtooth",0.24,20);},
  step(){tone(85,0.045,"square",0.05,-25);}

const LEAD_NOTES=[130,130,146,164,146,130,110,98,130,146,164,196,175,164,146,110];
function musicTick(dt){
  if(!audio || game.state!=="PLAY" || game.paused) return;
  beat-=dt;
  if(beat<=0){
    beat=0.19;
    beatStep=(beatStep+1)%16;
    if(beatStep%4===0){tone(68,0.09,"triangle",0.1,-22);}
    if(beatStep%4===2){noise(0.04,0.05);}
    if(beatStep%2===0){tone(LEAD_NOTES[beatStep],0.15,"square",0.05,0);}
  }
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const sign=v=>v<0?-1:v>0?1:0;
function aabb(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}
function box(e){return {x:e.x+e.hb.x,y:e.y+e.hb.y,w:e.hb.w,h:e.hb.h};}
function tileSolid(tx,ty){
  if(tx<0||tx>=MAP_W||ty<0||ty>=MAP_H) return ty>=MAP_H;
  return LEVEL_MAP[ty][tx]==="#";
}
function collideWorld(e,dt){
  e.onGround=false;
  e.x+=e.vx*dt;
  let b=box(e);
  if(e.vx>0){
    const tx=Math.floor((b.x+b.w-1)/16), y0=Math.floor(b.y/16), y1=Math.floor((b.y+b.h-1)/16);
    for(let ty=y0;ty<=y1;ty++) if(tileSolid(tx,ty)){e.x=tx*16-e.hb.x-e.hb.w;e.vx=0;break;}
  }else if(e.vx<0){
    const tx=Math.floor(b.x/16), y0=Math.floor(b.y/16), y1=Math.floor((b.y+b.h-1)/16);
    for(let ty=y0;ty<=y1;ty++) if(tileSolid(tx,ty)){e.x=(tx+1)*16-e.hb.x;e.vx=0;break;}
  }
  e.y+=e.vy*dt; b=box(e);
  if(e.vy>0){
    const ty=Math.floor((b.y+b.h-1)/16), x0=Math.floor(b.x/16), x1=Math.floor((b.x+b.w-1)/16);
    for(let tx=x0;tx<=x1;tx++) if(tileSolid(tx,ty)){e.y=ty*16-e.hb.y-e.hb.h;e.vy=0;e.onGround=true;break;}
  }else if(e.vy<0){
    const ty=Math.floor(b.y/16), x0=Math.floor(b.x/16), x1=Math.floor((b.x+b.w-1)/16);
    for(let tx=x0;tx<=x1;tx++) if(tileSolid(tx,ty)){e.y=(ty+1)*16-e.hb.y;e.vy=0;break;}
  }
}
function groundYAt(x){
  const tx=clamp(Math.floor(x/16),0,MAP_W-1);
  for(let ty=0;ty<MAP_H;ty++) if(tileSolid(tx,ty)) return ty*16;
  return 192;
}
function dist2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;}

let nextId=1;
class Entity{
  constructor(x,y){
    this.id=nextId++; this.x=x;this.y=y;this.vx=0;this.vy=0;
    this.dead=false;this.onGround=false;this.hb={x:0,y:0,w:12,h:12};
    this.state="idle";this.anim=0;this.flip=false;
  }
  update(dt){}
  draw(cam){}
}
class Bullet extends Entity{
  constructor(x,y,vx,vy,team="player",damage=1,kind="bullet"){
    super(x,y);this.vx=vx;this.vy=vy;this.team=team;this.damage=damage;this.kind=kind;
    this.life=kind==="cannon"?1.8:1.35; this.hb={x:-2,y:-2,w:4,h:4};
  }
  update(dt){
    if(this.kind==="arc") this.vy+=250*dt;
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=dt;
    if(this.life<=0||this.x<0||this.x>WORLD_W||this.y<-32||this.y>CONFIG.H+80){this.dead=true;return;}
    const tx=Math.floor(this.x/16),ty=Math.floor(this.y/16);
    if(tileSolid(tx,ty)){
      if(this.kind==="cannon"||this.kind==="arc") explode(this.x,this.y,34,this.damage,this.team);
      this.dead=true; impactPuff(this.x,this.y); return;
    }
    handleBulletHit(this);
  }
  draw(cam){
    const sp=this.kind==="arc"?SPRITES.shell:this.kind==="tracer"?SPRITES.tracer:SPRITES.bullet;
    drawSprite(sp,this.x-cam.x-4,this.y-4,1,this.vx<0);
  }
}
class Grenade extends Entity{
  constructor(x,y,dir){
    super(x,y); this.vx=dir*CONFIG.PLAYER.grenadeSpeed; this.vy=-165;
    this.fuse=CONFIG.GRENADE.fuse; this.hb={x:-3,y:-3,w:6,h:6};
  }
  update(dt){
    this.vy+=420*dt; this.x+=this.vx*dt; this.y+=this.vy*dt; this.fuse-=dt;
    const gy=groundYAt(this.x);
    if(this.y>gy-4){this.y=gy-4;this.vy*=-0.36;this.vx*=0.75;}
    if(this.fuse<=0){explode(this.x,this.y,CONFIG.GRENADE.radius,CONFIG.GRENADE.damage,"player");this.dead=true;}
  }
  draw(cam){drawSprite(SPRITES.grenade,this.x-cam.x-4,this.y-4,2);}
}
class Particle extends Entity{
  constructor(x,y,vx,vy,life,type="spark"){
    super(x,y);this.vx=vx;this.vy=vy;this.life=life;this.max=life;this.type=type;
  }
  update(dt){
    this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(this.type!=="smoke")this.vy+=150*dt;
    if(this.type==="casing"){
      const gy=groundYAt(this.x)-1;
      if(this.y>gy){this.y=gy;this.vy*=-0.34;this.vx*=0.66;}
    }
    if(this.life<=0)this.dead=true;
  }
  draw(cam){
    const a=clamp(this.life/this.max,0,1);
    if(this.type==="smoke") drawSprite(SPRITES.smoke,this.x-cam.x-6,this.y-6,1,false,a);
    else if(this.type==="casing"){
      ctx.globalAlpha=a;ctx.fillStyle=PAL["6"];ctx.fillRect(Math.round(this.x-cam.x),Math.round(this.y),1,2);ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=a;ctx.fillStyle=Math.random()<.5?PAL["J"]:PAL["K"];ctx.fillRect(Math.round(this.x-cam.x),Math.round(this.y),2,2);ctx.globalAlpha=1;
    }
  }
}
class Explosion extends Entity{
  constructor(x,y,big=false){super(x,y);this.t=0;this.big=big;this.life=big?0.48:0.30;}
  update(dt){this.t+=dt;if(this.t>=this.life)this.dead=true;}
  draw(cam){
    const f=this.t/this.life<.33?SPRITES.expl1:this.t/this.life<.66?SPRITES.expl2:SPRITES.expl3;
    const sc=this.big?3:2; drawSprite(f,this.x-cam.x-(f[0].length*sc)/2,this.y-(f.length*sc)/2,sc);
  }
}
class Item extends Entity{
  constructor(x,y,type){super(x,y);this.type=type;this.vy=-65;this.life=10;this.hb={x:-5,y:-5,w:10,h:10};}
  update(dt){
    this.vy+=220*dt;this.y+=this.vy*dt;const gy=groundYAt(this.x);if(this.y>gy-6){this.y=gy-6;this.vy=0;}
    this.life-=dt;if(this.life<=0)this.dead=true;
    if(player && !player.dead && aabb(box(player),box(this))){pickupItem(this);this.dead=true;}
  }
  draw(cam){drawSprite(SPRITES.item,this.x-cam.x-8,this.y-8,2);}
}
class Crate extends Entity{
  constructor(x,y,special=false){super(x,y);this.hp=3;this.special=special;this.hb={x:0,y:0,w:28,h:28};}
  hurt(d){
    this.hp-=d;shake(2,0.08);
    if(this.hp<=0){
      this.dead=true; explode(this.x+14,this.y+14,22,1,"player",false);
      let type;
      if(this.special==="rifle")type="rifle";
      else if(this.special)type="shotgun";
      else type=(Math.random()<.5?"score":"grenade");
      entities.push(new Item(this.x+14,this.y+5,type));
    }
  }
  draw(cam){drawSprite(SPRITES.crate,this.x-cam.x,this.y,2);}
}
class Hostage extends Entity{
  constructor(x,y){super(x,y);this.freed=false;this.hb={x:3,y:2,w:22,h:28};}
  free(){
    if(this.freed)return;this.freed=true;game.hostages++;game.score+=500;SFX.pickup();
    const r=Math.random();entities.push(new Item(this.x+14,this.y+2,r<.34?"shotgun":r<.67?"grenade":"score"));
  }
  update(dt){if(this.freed){this.vx=24;this.vy+=500*dt;collideWorld(this,dt);if(this.x>player.x+220)this.dead=true;}}
  draw(cam){drawSprite(SPRITES.hostage,this.x-cam.x,this.y,2,this.freed);}
}
class EnemyDeathFx extends Entity{
  constructor(x,y,flip,type){
    super(x,y);this.flip=flip;this.type=type;this.t=0;this.life=type==="explosion"?.48:.42;
    this.vx=type==="shot"?(flip?45:-45):type==="knife"?(flip?20:-20):0;
    this.vy=type==="explosion"?-95:type==="shot"?-42:-28;
  }
  update(dt){
    this.t+=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=260*dt;
    if(this.t>=this.life)this.dead=true;
  }
  draw(cam){
    const a=clamp(1-this.t/this.life,0,1);
    ctx.save();ctx.globalAlpha=a;
    if(this.type==="explosion"){
      const f=this.t<this.life*.5?SPRITES.expl2:SPRITES.smoke;
      drawSprite(f,this.x-cam.x-8,this.y-4,2,this.flip,a);
    }else{
      ctx.translate(Math.round(this.x-cam.x+14),Math.round(this.y+16));
      const rot=this.type==="knife"?(this.flip?-.55:.55):(this.flip?.32:-.32);
      ctx.rotate(rot*(this.t/this.life));
      drawSprite(SPRITES.enemy_idle,-14,-16,2,this.flip,a);
      if(this.type==="knife"){
        ctx.fillStyle=PAL["G"];ctx.fillRect(this.flip?-16:10,-5,8,2);
        ctx.fillStyle=PAL["O"];ctx.fillRect(this.flip?-19:15,-6,5,1);
      }
    }
    ctx.restore();
  }
}
class Enemy extends Entity{
  constructor(x,y,type="runner"){
    super(x,y);this.type=type;this.hp=type==="rifle"?2:1;this.hb={x:5,y:2,w:18,h:29};
    this.cool=rnd(.2,1.0);this.react=0;this.deathType="shot";this.seen=false;this.detectT=0;
  }
  hurt(d,kind="shot",from=1){
    if(this.dead)return;
    this.hp-=d;this.react=.11;this.vx=-from*55;this.state="react";
    if(this.hp<=0){this.deathType=kind;this.kill();}
  }
  kill(){
    this.dead=true;game.score+=this.type==="rifle"?250:150;
    entities.push(new EnemyDeathFx(this.x,this.y,this.flip,this.deathType));
    if(this.deathType==="explosion") for(let i=0;i<5;i++)particles.push(new Particle(this.x+14,this.y+12,rnd(-70,70),rnd(-110,-30),rnd(.25,.6)));
    else if(this.deathType==="knife") {SFX.knife();particles.push(new Particle(this.x+12,this.y+9,rnd(-25,25),-50,.25));}
  }
  update(dt){
    if(this.dead)return;
    this.cool-=dt;this.anim+=dt*8;
    const dx=player.x-this.x, ad=Math.abs(dx);
    if(this.react>0){this.react-=dt;this.vy+=CONFIG.PLAYER.gravity*dt;collideWorld(this,dt);return;}
    if(ad>CONFIG.ENEMY.detect){
      this.state="idle";this.vx=0;this.seen=false;
    } else {
      if(!this.seen){this.seen=true;this.detectT=.14;this.state="detect";}
      if(this.detectT>0){
        this.detectT-=dt;this.vx=0;
      } else if(this.type==="runner"){
        this.state=ad<28?"attack":"approach";
        if(ad>=28)this.vx=sign(dx)*CONFIG.ENEMY.speed;
        else {this.vx=0;if(this.cool<=0){this.cool=.9; enemyMelee(this);}}
      } else {
        if(ad>112){this.state="approach";this.vx=sign(dx)*26;}
        else if(ad<68){this.state="cover";this.vx=-sign(dx)*28;}
        else {this.state="attack";this.vx=0;if(this.cool<=0){this.cool=CONFIG.ENEMY.rifleRate+rnd(-.2,.2);enemyShoot(this);}}
      }
    }
    this.flip=dx<0;this.vy+=CONFIG.PLAYER.gravity*dt;collideWorld(this,dt);
  }
  draw(cam){
    let sp=this.type==="rifle"?SPRITES.rifle:((Math.floor(this.anim)%2)?SPRITES.enemy_run1:SPRITES.enemy_run2);
    if(this.state==="idle")sp=SPRITES.enemy_idle;
    drawSprite(sp,this.x-cam.x,this.y,2,this.flip);
  }
}
class Turret extends Entity{
  constructor(x,y){super(x,y);this.hp=CONFIG.TURRET.hp;this.cool=rnd(.2,1);this.hb={x:2,y:4,w:28,h:20};}
  hurt(d,kind="shot"){this.hp-=d; if(this.hp<=0){this.dead=true;game.score+=500;explode(this.x+16,this.y+12,34,2,"player");}}
  update(dt){
    if(Math.abs(player.x-this.x)>190)return;
    this.cool-=dt;
    if(this.cool<=0){this.cool=CONFIG.TURRET.fireRate;const dir=sign(player.x-this.x);entities.push(new Bullet(this.x+16+dir*16,this.y+7,dir*155,-10,"enemy",1));casing(this.x+14,this.y+7,dir);SFX.shot();}
  }
  draw(cam){drawSprite(SPRITES.turret,this.x-cam.x,this.y,2,player.x<this.x);}
}
class Tank extends Entity{
  constructor(x,y){super(x,y);this.armor=CONFIG.TANK.armor;this.active=false;this.hb={x:2,y:8,w:38,h:24};this.fireCd=0;this.cannonCd=0;}
  update(dt){
    this.fireCd-=dt;this.cannonCd-=dt;
    if(!this.active){
      this.vy+=CONFIG.PLAYER.gravity*dt;collideWorld(this,dt);
      if(!player.inTank && Math.abs(player.x-this.x)<28 && Math.abs(player.y-this.y)<35){this.active=true;player.inTank=this;SFX.pickup();}
      return;
    }
    const gp=gamepadState();
    const L=down("arrowleft","a")||gp?.l,R=down("arrowright","d")||gp?.r,U=down("arrowup","w")||gp?.u,D=down("arrowdown","s")||gp?.d;
    this.vx=(R-L)*CONFIG.TANK.speed;if(this.vx)this.flip=this.vx<0;
    if((hit("x","k")||gp?.jump)&&this.onGround){this.vy=-CONFIG.TANK.jump;SFX.jump();}
    this.vy+=CONFIG.PLAYER.gravity*dt;collideWorld(this,dt);
    const aim=aimVector(this.flip? -1:1,L,R,U,D);
    if((down("z","j")||gp?.fire)&&this.fireCd<=0){
      this.fireCd=CONFIG.TANK.machineRate;
      entities.push(new Bullet(this.x+21+aim.x*20,this.y+11+aim.y*8,aim.x*300,aim.y*300,"player",1,"bullet"));casing(this.x+22,this.y+9,this.flip?-1:1);SFX.shot();
    }
    if((hit("c","l")||gp?.nade)&&this.cannonCd<=0){
      this.cannonCd=CONFIG.TANK.cannonRate;
      entities.push(new Bullet(this.x+21+aim.x*22,this.y+9+aim.y*7,aim.x*175,aim.y*175,"player",5,"cannon"));SFX.boom();
    }
    // Aplastar enemigos
    for(const e of entities) if(e instanceof Enemy && !e.dead && aabb(box(this),box(e)) && Math.abs(this.vx)>25)e.hurt(99,"explosion",sign(this.vx));
    player.x=this.x+10;player.y=this.y-8;
  }
  hurt(d){
    this.armor-=d;shake(4,.12);SFX.boom();
    if(this.armor<=0){
      this.dead=true;this.active=false;player.inTank=null;
      explode(this.x+20,this.y+14,55,7,"player");
      player.x=this.x;player.y=this.y-30;player.vy=-130;player.invuln=1.0;
    }
  }
  draw(cam){drawSprite(SPRITES.tank,this.x-cam.x,this.y,2,this.flip);}
}
class Boss extends Entity{
  constructor(x,y){
    super(x,y);this.hp=CONFIG.BOSS.hp;this.max=CONFIG.BOSS.hp;this.hb={x:2,y:12,w:68,h:42};
    this.cool=.8;this.phase=1;this.dir=-1;this.exploding=false;this.explodeT=0;this.ram=0;
  }
  hurt(d,kind="shot"){
    if(this.exploding)return;
    this.hp=Math.max(0,this.hp-d);shake(d>=4?5:2,d>=4?.13:.06);
    if(this.hp<=0){this.exploding=true;this.explodeT=2;SFX.boss();game.score+=10000;}
  }
  update(dt){
    if(this.exploding){
      this.explodeT-=dt;
      if(Math.random()<dt*12) explode(this.x+rnd(5,68),this.y+rnd(5,46),rnd(24,42),0,"player",true);
      if(this.explodeT<=0){this.dead=true;game.state="RESULTS";game.clearTime=game.runTime;SFX.boom();}
      return;
    }
    this.phase=this.hp>60?1:this.hp>30?2:3;
    this.cool-=dt;
    if(this.phase===1 && this.cool<=0){
      this.cool=CONFIG.BOSS.p1Rate;const dx=player.x-(this.x+18);
      const vx=clamp(dx*.72,-145,145);
      entities.push(new Bullet(this.x+15,this.y+8,vx,-155,"enemy",1,"arc"));SFX.boom();
    }
    if(this.phase===2 && this.cool<=0){
      this.cool=CONFIG.BOSS.p2Rate;
      for(const yy of [12,28]){
        const dx=player.x-this.x,dy=(player.y+12)-(this.y+yy),m=Math.hypot(dx,dy)||1;
        entities.push(new Bullet(this.x+6,this.y+yy,dx/m*135,dy/m*135,"enemy",1,"bullet"));
      }
      SFX.shot();
    }
    if(this.phase===3){
      if(this.ram>0){this.ram-=dt;this.vx=this.dir*110;collideWorld(this,dt);}
      else {this.vx=0;if(this.cool<=0){this.cool=CONFIG.BOSS.p3Rate;this.dir=sign(player.x-this.x)||-1;this.ram=.62;shake(3,.3);for(let i=0;i<5;i++)particles.push(new Particle(this.x+rnd(0,70),groundYAt(this.x)-2,rnd(-25,25),rnd(-80,-20),.55,"smoke"));}}
      if(aabb(box(this),box(player))&&!player.inTank) player.die();
    }
  }
  draw(cam){
    drawSprite(SPRITES.boss,this.x-cam.x,this.y,2,this.dir>0);
    if(this.phase>=2){ // lanzamisiles laterales
      ctx.fillStyle=PAL["0"];ctx.fillRect(Math.round(this.x-cam.x-4),Math.round(this.y+25),8,4);
      ctx.fillStyle=PAL["H"];ctx.fillRect(Math.round(this.x-cam.x-3),Math.round(this.y+26),5,2);
    }
    if(this.phase===3){ // grietas
      ctx.fillStyle=PAL["1"];
      const gx=Math.round(this.x-cam.x+35), gy=Math.round(groundYAt(this.x+35));
      ctx.fillRect(gx-10,gy-2,22,2);ctx.fillRect(gx-2,gy-5,2,5);ctx.fillRect(gx+8,gy-4,2,4);
    }
  }
}
class Player extends Entity{
  constructor(x,y){
    super(x,y);this.hb={x:6,y:2,w:16,h:29};this.lives=CONFIG.PLAYER.lives;this.grenades=CONFIG.PLAYER.grenadeCount;
    this.special=0;this.rifleAmmo=0;this.fireCd=0;this.knifeCd=0;this.knifeT=0;this.invuln=1;this.facing=1;this.inTank=null;this.crouch=false;
    this.lastStep=-1;
  }
  die(){
    if(this.invuln>0||game.state!=="PLAY"||this.inTank)return;
    this.lives--;SFX.death();shake(6,.25);
    for(let i=0;i<8;i++)particles.push(new Particle(this.x+14,this.y+12,rnd(-90,90),rnd(-150,-45),rnd(.35,.8)));
    this.special=0;this.rifleAmmo=0;this.grenades=CONFIG.PLAYER.grenadeCount;
    if(this.lives<=0){game.state="GAMEOVER";return;}
    this.x=Math.max(game.checkpoint,48);this.y=80;this.vx=0;this.vy=0;this.invuln=CONFIG.PLAYER.invulnRespawn;
  }
  update(dt){
    if(this.inTank){this.invuln=Math.max(0,this.invuln-dt);return;}
    const gp=gamepadState();
    const L=down("arrowleft","a")||gp?.l,R=down("arrowright","d")||gp?.r,U=down("arrowup","w")||gp?.u,D=down("arrowdown","s")||gp?.d;
    const move=(R?1:0)-(L?1:0);if(move)this.facing=move;
    this.crouch=D&&this.onGround&&!move;
    this.hb=this.crouch?{x:6,y:14,w:16,h:17}:{x:6,y:2,w:16,h:29};
    const target=move*CONFIG.PLAYER.run, acc=this.onGround?CONFIG.PLAYER.accel:CONFIG.PLAYER.airAccel;
    if(move) this.vx += clamp(target-this.vx,-acc*dt,acc*dt);
    else if(this.onGround) this.vx += clamp(-this.vx,-CONFIG.PLAYER.friction*dt,CONFIG.PLAYER.friction*dt);
    if((hit("x","k")||gp?.jump)&&this.onGround&&!this.crouch){this.vy=-CONFIG.PLAYER.jump;SFX.jump();}
    if(!(down("x","k")||gp?.jump)&&this.vy<0)this.vy+=CONFIG.PLAYER.gravity*CONFIG.PLAYER.jumpCut*dt;
    this.vy=clamp(this.vy+CONFIG.PLAYER.gravity*dt,-999,CONFIG.PLAYER.maxFall);
    collideWorld(this,dt);
    this.x=clamp(this.x,0,WORLD_W-28);
    this.anim+=Math.abs(this.vx)*dt*.09;this.fireCd-=dt;this.knifeCd-=dt;this.knifeT-=dt;this.invuln-=dt;
    if(this.onGround&&Math.abs(this.vx)>8&&!this.crouch){
      const sf=Math.floor(this.anim)%4;
      if(sf!==this.lastStep&&(sf===0||sf===2))SFX.step();
      this.lastStep=sf;
    }

    const aim=aimVector(this.facing,L,R,U,D);
    if((down("z","j")||gp?.fire)&&this.fireCd<=0&&!this.crouch){
      if(this.special>0){
        this.fireCd=CONFIG.SHOTGUN.fireRate;this.special--;SFX.shotgun();
        const base=Math.atan2(aim.y,aim.x);
        for(const s of [-CONFIG.SHOTGUN.spread,0,CONFIG.SHOTGUN.spread]){
          entities.push(new Bullet(this.x+14+aim.x*12,this.y+12+aim.y*7,Math.cos(base+s)*CONFIG.SHOTGUN.speed,Math.sin(base+s)*CONFIG.SHOTGUN.speed,"player",CONFIG.SHOTGUN.damage,"bullet"));
        }
        casing(this.x+13,this.y+9,this.facing);
      } else if(this.rifleAmmo>0){
        this.fireCd=CONFIG.RIFLE.fireRate;this.rifleAmmo--;SFX.shot();
        entities.push(new Bullet(this.x+14+aim.x*12,this.y+12+aim.y*7,aim.x*CONFIG.RIFLE.speed,aim.y*CONFIG.RIFLE.speed,"player",CONFIG.RIFLE.damage,"tracer"));
        casing(this.x+13,this.y+9,this.facing);
      } else {
        this.fireCd=CONFIG.PLAYER.fireRate;SFX.shot();
        entities.push(new Bullet(this.x+14+aim.x*12,this.y+12+aim.y*7,aim.x*CONFIG.PISTOL.speed,aim.y*CONFIG.PISTOL.speed,"player",1,"bullet"));
        casing(this.x+13,this.y+9,this.facing);
      }
    }
    if((hit("c","l")||gp?.nade)&&this.grenades>0){this.grenades--;entities.push(new Grenade(this.x+14,this.y+10,this.facing));}
    if((hit("shift")||gp?.knife)&&this.knifeCd<=0){
      this.knifeCd=CONFIG.PLAYER.knifeCooldown;this.knifeT=CONFIG.PLAYER.knifeTime;SFX.knife();melee(this);
    }
    if(this.y>CONFIG.H+45)this.die();
  }
  draw(cam){
    if(this.inTank)return;
    if(this.invuln>0&&Math.floor(this.invuln*14)%2===0)return;
    let sp=SPRITES.player_idle;
    if(this.crouch)sp=SPRITES.player_crouch;
    else if(Math.abs(this.vx)>8){
      const rf=[SPRITES.player_run1,SPRITES.player_run2,SPRITES.player_run3,SPRITES.player_run4];
      sp=rf[Math.floor(this.anim)%4];
    }
    drawSprite(sp,this.x-cam.x,this.y,2,this.facing<0);
    if(this.knifeT>0){
      ctx.fillStyle=PAL["O"];
      const kx=this.x-cam.x+(this.facing>0?27:-7),ky=this.y+12;
      ctx.fillRect(Math.round(kx),Math.round(ky),8,2);ctx.fillStyle=PAL["0"];ctx.fillRect(Math.round(kx+(this.facing>0?6:0)),Math.round(ky+2),2,2);
    }
  }
}

function aimVector(facing,L,R,U,D){
  let x=facing,y=0;
  if(U||D){
    y=U?-1:1;
    if(L)x=-1; else if(R)x=1; else x=0;
  } else if(L||R){
    x=L?-1:1;
  }
  const m=Math.hypot(x,y)||1;return{x:x/m,y:y/m};
}

/* ============================================================
   COMBATE
   ============================================================ */
function enemyShoot(e){
  const dx=(player.x+14)-(e.x+14),dy=(player.y+12)-(e.y+10),m=Math.hypot(dx,dy)||1;
  entities.push(new Bullet(e.x+14,e.y+10,dx/m*150,dy/m*150,"enemy",1));casing(e.x+12,e.y+8,sign(dx)||1);SFX.shot();
}
function enemyMelee(e){if(!player.inTank && Math.abs(player.x-e.x)<26 && Math.abs(player.y-e.y)<32)player.die();}
function melee(p){
  const kb={x:p.x+(p.facing>0?18:-14),y:p.y+3,w:24,h:26};
  for(const e of entities){
    if(e.dead)continue;
    if(e instanceof Enemy && aabb(kb,box(e)))e.hurt(99,"knife",p.facing);
    if(e instanceof Hostage && !e.freed && aabb(kb,box(e)))e.free();
    if(e instanceof Crate && aabb(kb,box(e)))e.hurt(2);
  }
}
function handleBulletHit(b){
  if(b.team==="player"){
    for(const e of entities){
      if(e.dead||e===b)continue;
      if((e instanceof Enemy||e instanceof Turret||e instanceof Crate||e instanceof Boss) && aabb(box(b),box(e))){
        if(e instanceof Crate)e.hurt(b.damage); else e.hurt(b.damage,b.kind==="cannon"?"explosion":"shot",sign(b.vx));
        b.dead=true;impactPuff(b.x,b.y);return;
      }
    }
  }else{
    if(player.inTank){
      if(aabb(box(b),box(player.inTank))){player.inTank.hurt(1);b.dead=true;return;}
    }else if(aabb(box(b),box(player))){b.dead=true;player.die();}
  }
}
function explode(x,y,r,dmg,team="player",visual=true){
  if(visual!==false)entities.push(new Explosion(x,y,r>35));SFX.boom();shake(r>35?6:3,r>35?.18:.09);
  for(let i=0;i<8;i++)particles.push(new Particle(x,y,rnd(-90,90),rnd(-120,20),rnd(.25,.7),Math.random()<.35?"smoke":"spark"));

  if(team==="enemy"){
    const target=player.inTank?player.inTank:player;
    if(target){
      const tb=box(target),tx=tb.x+tb.w/2,ty=tb.y+tb.h/2;
      if((tx-x)*(tx-x)+(ty-y)*(ty-y)<=r*r){
        if(player.inTank)player.inTank.hurt(1); else player.die();
      }
    }
    return;
  }

  for(const e of entities){
    if(e.dead)continue;
    const eb=box(e),ex=eb.x+eb.w/2,ey=eb.y+eb.h/2;
    if((ex-x)*(ex-x)+(ey-y)*(ey-y)<=r*r){
      if(e instanceof Enemy)e.hurt(dmg,"explosion",sign(ex-x));
      else if(e instanceof Turret||e instanceof Boss)e.hurt(dmg,"explosion");
      else if(e instanceof Crate)e.hurt(dmg);
    }
  }
}
function impactPuff(x,y){for(let i=0;i<3;i++)particles.push(new Particle(x,y,rnd(-25,25),rnd(-45,-10),rnd(.12,.28)));}
function casing(x,y,dir=1){particles.push(new Particle(x,y,-dir*rnd(18,34),rnd(-72,-45),rnd(.55,.95),"casing"));}

let mortars=[];
class MortarWarning{
  constructor(x){this.x=x;this.t=.9;this.dead=false;}
  update(dt){this.t-=dt;if(this.t<=0){explode(this.x,groundYAt(this.x)-4,45,1,"enemy");this.dead=true;}}

   ESTADO GLOBAL
   ============================================================ */
let entities=[],particles=[],player=null,boss=null,ambushSpawnTimer=0,ambushCount=0;
const cam={x:0,shakeT:0,shakeMag:0,sx:0,sy:0};
const game={
  state:"TITLE",paused:false,score:0,hostages:0,continues:CONFIG.CONTINUES,runTime:0,clearTime:0,checkpoint:48
};
function startGame(full=true){
  if(full){game.score=0;game.hostages=0;game.continues=CONFIG.CONTINUES;game.runTime=0;}
  player=new Player(50,120);buildLevel();game.checkpoint=48;game.state="PLAY";game.paused=false;cam.x=0;
}
function continueGame(){
  if(game.continues<=0){game.state="TITLE";return;}
  game.continues--; player=new Player(Math.max(game.checkpoint,48),120);buildLevel();
  // Eliminar spawns muy atrás del checkpoint
  for(const e of entities) if(e.x<game.checkpoint-180 && !(e instanceof Tank))e.dead=true;
  game.state="PLAY";
}
function shake(mag,t){cam.shakeMag=Math.max(cam.shakeMag,mag);cam.shakeT=Math.max(cam.shakeT,t);}

/* ============================================================
   ACTUALIZACIÓN
   ============================================================ */
function update(dt){
  musicTick(dt);
  if(hit("p")&&game.state==="PLAY")game.paused=!game.paused;
  if(game.state==="TITLE"){
    if(hit("z","j","enter"))startGame(true);
    clearPressed();return;
  }
  if(game.state==="GAMEOVER"){
    if(hit("z","j","enter"))continueGame();
    clearPressed();return;
  }
  if(game.state==="RESULTS"){
    if(hit("z","j","enter"))game.state="TITLE";
    clearPressed();return;
  }
  if(game.paused){clearPressed();return;}

  game.runTime+=dt;
  player.update(dt);
  for(const e of entities) if(!e.dead)e.update(dt);
  for(const p of particles) if(!p.dead)p.update(dt);
  for(const m of mortars) if(!m.dead)m.update(dt);
  entities=entities.filter(e=>!e.dead);particles=particles.filter(p=>!p.dead);mortars=mortars.filter(m=>!m.dead);

  // Checkpoints
  if(player.x>900)game.checkpoint=Math.max(game.checkpoint,900);
  if(player.x>1750)game.checkpoint=Math.max(game.checkpoint,1750);

  // Emboscada: oleadas desde ambos lados y morteros
  if(player.x>CONFIG.WORLD.ambushStart && player.x<CONFIG.WORLD.ambushEnd && !boss){
    ambushSpawnTimer-=dt;
    if(ambushSpawnTimer<=0 && ambushCount<12){
      ambushSpawnTimer=.8;ambushCount++;
      const side=ambushCount%2?1:-1;
      entities.push(new Enemy(player.x+side*190,150,ambushCount%3===0?"rifle":"runner"));
      if(ambushCount%2===0)mortars.push(new MortarWarning(clamp(player.x+rnd(-70,70),CONFIG.WORLD.ambushStart,CONFIG.WORLD.ambushEnd)));
    }
  }

  // Jefe
  if(player.x>CONFIG.WORLD.bossTrigger && !boss){
    boss=new Boss(2680,126);entities.push(boss);SFX.boss();
  }

  // Cámara
  let target=player.x-110;
  if(boss)target=clamp(target,CONFIG.WORLD.bossTrigger-70,WORLD_W-CONFIG.W);
  cam.x+=clamp(target-cam.x,-150*dt,150*dt);cam.x=clamp(cam.x,0,WORLD_W-CONFIG.W);
  if(cam.shakeT>0){cam.shakeT-=dt;cam.sx=rnd(-cam.shakeMag,cam.shakeMag);cam.sy=rnd(-cam.shakeMag,cam.shakeMag);}
  else{cam.sx=cam.sy=0;cam.shakeMag=0;}

  clearPressed();
}

  ctx.fillStyle="rgba(10,4,3,.72)";ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  hazardStripes(0,0,CONFIG.W,5,1);
  hazardStripes(0,CONFIG.H-5,CONFIG.W,5,1);
  drawPanel(60,52,CONFIG.W-120,118,PAL["G"]);
  cornerBracket(60,52,CONFIG.W-120,118,PAL["H"],8);
  drawSprite(SPRITES.icon_skull,CONFIG.W/2-9,60,3);
  textPx("GAME OVER",CONFIG.W/2+1,101,4,PAL["G"],"center");
  textPx("GAME OVER",CONFIG.W/2,100,4,PAL["H"],"center");
  if(game.continues>0){
    textPx("CONTINUAR "+game.continues,CONFIG.W/2,134,2,PAL["K"],"center");
    if(blinkOn())textPx("PULSA Z",CONFIG.W/2,152,1,PAL["7"],"center");
  }else{
    textPx("SIN CONTINUES",CONFIG.W/2,136,2,PAL["M"],"center");
    if(blinkOn())textPx("PULSA Z",CONFIG.W/2,153,1,PAL["7"],"center");
  }
}
function drawResults(){
  ctx.fillStyle=PAL["0"];ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  hazardStripes(0,0,CONFIG.W,6,1);
  hazardStripes(0,CONFIG.H-6,CONFIG.W,6,1);
  drawPanel(30,28,CONFIG.W-60,CONFIG.H-64,PAL["I"]);
  cornerBracket(30,28,CONFIG.W-60,CONFIG.H-64,PAL["6"],8);
  drawSprite(SPRITES.icon_star,CONFIG.W/2-9,36,2);
  textPx("MISION COMPLETA",CONFIG.W/2+1,55,3,PAL["G"],"center");
  textPx("MISION COMPLETA",CONFIG.W/2,54,3,PAL["K"],"center");
  textPx("PUNTAJE "+String(game.score).padStart(7,"0"),CONFIG.W/2,96,2,PAL["7"],"center");
  textPx("REHENES "+game.hostages,CONFIG.W/2,118,2,PAL["W"],"center");
  const t=Math.floor(game.clearTime),m=Math.floor(t/60),s=String(t%60).padStart(2,"0");
  textPx("TIEMPO "+m+":"+s,CONFIG.W/2,140,2,PAL["J"],"center");
  if(blinkOn())textPx("Z PARA VOLVER",CONFIG.W/2,178,1,PAL["7"],"center");
}

/* ============================================================
   LOOP FIJO 60 FPS LÓGICOS
   ============================================================ */
let last=performance.now()/1000,acc=0;
function loop(nowMs){
  const now=nowMs/1000;let frame=Math.min(.25,now-last);last=now;acc+=frame;
  while(acc>=CONFIG.FIXED_DT){update(CONFIG.FIXED_DT);acc-=CONFIG.FIXED_DT;}
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
