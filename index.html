function imgReady(img){ return img && img.complete && img.naturalWidth>0; }
// Rig de recorte estilo Spine: el torso se dibuja entero y las dos piernas se
// recortan del mismo PNG y rotan en contrafase alrededor de la cadera, lo que
// produce el ciclo de tijera de una carrera 2D con un solo dibujo de origen.
// Centro x de cada pierna a la altura de la rodilla, medido una vez sobre el alfa del PNG.
function rigKnees(img){
  if(img._knees) return img._knees;
  const rig=img.rig, sw=img.naturalWidth, sh=img.naturalHeight;
  const c=document.createElement("canvas"); c.width=sw; c.height=sh;
  const g=c.getContext("2d"); g.drawImage(img,0,0);
  const at=f=>g.getImageData(0,Math.round(rig.pivy+(rig.bot-rig.pivy)*f),sw,1).data;
  const cent=(row,a,b,def)=>{let t=0,n=0;for(let x=a;x<b;x++){if(row[x*4+3]>128){t+=x;n++;}}return n?t/n:def;};
  const kr=at(0.5), ar=at(rig.ankle||0.84);
  const kb=cent(kr,0,rig.split,rig.split/2), kf=cent(kr,rig.split,sw,(rig.split+sw)/2);
  img._knees=[kb,kf,cent(ar,0,rig.split,kb),cent(ar,rig.split,sw,kf)];
  return img._knees;
}
// Rig de recorte con dos segmentos por pierna (muslo + pantorrilla). La fase es
// continua, asi que el ciclo contacto->descenso->paso->elevacion no tiene saltos
// entre frames: la rodilla se dobla solo en la fase de recuperacion (cos>0).
// Brazos recortados del mismo PNG: capa por brazo y un cuerpo sin ellos (el hombro se conserva)
function armLayers(img){
  if(img._body)return true;
  const sw=img.naturalWidth, sh=img.naturalHeight;
  const body=document.createElement("canvas"); body.width=sw; body.height=sh;
  const b=body.getContext("2d"); b.drawImage(img,0,0);
  img._arms=img.rig.arms.map(a=>{
    const c=document.createElement("canvas"); c.width=sw; c.height=sh; const g=c.getContext("2d");
    const path=new Path2D(); a.poly.forEach(([px,py],i)=>i?path.lineTo(px,py):path.moveTo(px,py)); path.closePath();
    g.save(); g.clip(path); g.drawImage(img,0,0); g.restore();
    b.save(); b.globalCompositeOperation="destination-out"; b.fill(path); b.restore();
    return {c,a};
  });
  for(const {a} of img._arms){ const p=new Path2D(); p.arc(a.piv[0],a.piv[1],a.keep??12,0,Math.PI*2); b.save(); b.clip(p); b.drawImage(img,0,0); b.restore(); }
  img._body=body; return true;
}
function drawCharImg(img,x,y,h,flip,anim=0,moving=false){
  const sw=img.naturalWidth, sh=img.naturalHeight;
  const k=h/sh, w=sw*k;
  const rig=img.rig, animate=moving&&rig&&rig.bot;
  const phase=anim*Math.PI*0.6;
  const lift=animate?(1-Math.abs(Math.sin(phase)))*2.6:0;
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  ctx.translate(Math.round(x),Math.round(y-lift));
  if(flip)ctx.scale(-1,1);
  const left=-w/2, topY=-h;
  if(animate){
    const [kbx,kfx,abx,afx]=rigKnees(img);
    const kneeY=rig.pivy+(rig.bot-rig.pivy)*0.5, ankleY=rig.pivy+(rig.bot-rig.pivy)*(rig.ankle||0.84);
    const toX=v=>left+v*k, toY=v=>topY+v*k;
    const hipX=toX(rig.pivx), hipY=toY(rig.pivy);
    const A=rig.thigh??0.4, K=rig.knee??0.95, F=rig.foot??0.45;
    // cuerpo inclinado hacia delante con un leve vaiven de cadera dos veces por zancada
    ctx.translate(hipX,hipY); ctx.rotate((rig.lean??0.07)+Math.sin(phase*2)*0.022); ctx.translate(-hipX,-hipY);
    const arms=rig.arms&&armLayers(img)?img._arms:null, src=arms?img._body:img;
    // brazos en contrafase con la pierna del mismo lado; "wave" = agitar los brazos en alto
    const drawArm=(L,i)=>{
      const a=L.a, rot=a.wave?Math.sin(phase*2+i*1.3)*a.amp:(a.back?-1:1)*Math.sin(phase)*a.amp;
      const X0=toX(a.piv[0]), Y0=toY(a.piv[1]);
      ctx.save(); ctx.translate(X0,Y0); ctx.rotate(rot); ctx.translate(-X0,-Y0);
      ctx.drawImage(L.c,left,topY,w,h); ctx.restore();
    };
    const legs=[[0,rig.split,phase+Math.PI,kbx,abx,true],[rig.split,sw-rig.split,phase,kfx,afx,false]];
    // relleno fijo entre los muslos: evita que se vea el fondo cuando las piernas se abren mucho
    const fillW=18, fx0=rig.pivx-fillW/2;
    ctx.drawImage(src,fx0,rig.legtop,fillW,kneeY-rig.legtop,toX(fx0),toY(rig.legtop),fillW*k,(kneeY-rig.legtop)*k);
    for(const [sx,swid,p,kx,ax,back] of legs){
      const s=Math.sin(p), c=Math.cos(p);
      // muslo: tijera; rodilla: se dobla en el vuelo y amortigua al apoyar el talon
      const thigh=-s*A;
      const knee=Math.max(0,c)*K+(c<0?0.18*K*(-c)*Math.max(0,s):0);
      // tobillo: punta arriba al apoyar el talon, empuje con la punta al despegar, punta colgando en el vuelo
      const foot=c<0?(s<0?F*(-s)*(-c)*2:-F*s*(-c)):F*0.35*c;
      const kX=toX(kx), kY=toY(kneeY), aX=toX(ax), aY=toY(ankleY);
      ctx.save();
      if(back)ctx.filter="brightness(0.72)";
      ctx.translate(hipX,hipY); ctx.rotate(thigh); ctx.translate(-hipX,-hipY);
      ctx.drawImage(src,sx,rig.legtop,swid,kneeY+7-rig.legtop,toX(sx),toY(rig.legtop),swid*k,(kneeY+7-rig.legtop)*k);
      ctx.translate(kX,kY); ctx.rotate(knee); ctx.translate(-kX,-kY);
      ctx.drawImage(src,sx,kneeY-8,swid,ankleY+5-(kneeY-8),toX(sx),kY-8*k,swid*k,(ankleY+5-(kneeY-8))*k);
      ctx.translate(aX,aY); ctx.rotate(foot); ctx.translate(-aX,-aY);
      ctx.drawImage(src,sx,ankleY-5,swid,sh-ankleY+5,toX(sx),aY-5*k,swid*k,(sh-ankleY+5)*k);
      ctx.restore();
    }
    // el torso baja 8 px de mas para tapar la cuña que abren los muslos en la entrepierna
    const tb=Math.min(sh,rig.torsobot+8);
    if(arms) arms.forEach((L,i)=>{ if(L.a.back)drawArm(L,i); });
    ctx.drawImage(src,0,0,sw,tb,left,topY,w,tb*k);
    if(arms) arms.forEach((L,i)=>{ if(!L.a.back)drawArm(L,i); });
  } else {
    ctx.drawImage(img,left,topY,w,h);
  }
  ctx.restore();
}

function resizeCanvas(){
  const s = Math.max(1, Math.floor(Math.min(innerWidth/CONFIG.W, innerHeight/CONFIG.H)));
  canvas.style.width = (CONFIG.W*s)+"px";
  canvas.style.height = (CONFIG.H*s)+"px";
}

const spriteCache = new Map();
function spriteCanvas(matrix, scale=1){
  const key = matrix.join("|")+"@"+scale;
  if(spriteCache.has(key)) return spriteCache.get(key);
  const h=matrix.length, w=matrix[0].length;
  const c=document.createElement("canvas");
  c.width=w*scale; c.height=h*scale;
  const g=c.getContext("2d"); g.imageSmoothingEnabled=false;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const ch=matrix[y][x];
    if(ch==="." || !PAL[ch]) continue;
    g.fillStyle=PAL[ch];
    g.fillRect(x*scale,y*scale,scale,scale);
  }
  spriteCache.set(key,c);
  return c;
}
function drawSprite(matrix,x,y,scale=2,flip=false,alpha=1){
  const s=spriteCanvas(matrix,scale);
  ctx.save();
  ctx.globalAlpha=alpha;
  if(flip){ctx.translate(Math.round(x)+s.width,Math.round(y));ctx.scale(-1,1);ctx.drawImage(s,0,0);}
  else ctx.drawImage(s,Math.round(x),Math.round(y));
  ctx.restore();
}

function textPx(str,x,y,scale=1,color=PAL["7"],align="left"){
  str=String(str).toUpperCase();

  if(align==="center") x-=w/2;

  ctx.fillStyle=color;

function hazardStripes(x,y,w,h,dir=1){
  ctx.save();
  ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle=PAL["0"];ctx.fillRect(x,y,w,h);
  const step=6;
  for(let i=-h;i<w+h;i+=step){
    ctx.fillStyle=(Math.floor(i/step)%2===0)?PAL["J"]:PAL["0"];
    ctx.beginPath();
    ctx.moveTo(x+i,y);ctx.lineTo(x+i+h*dir,y+h);ctx.lineTo(x+i+step+h*dir,y+h);ctx.lineTo(x+i+step,y);
    ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function drawPanel(x,y,w,h,accent=PAL["I"]){

let audio=null, master=null, beat=0, beatStep=0;
function initAudio(){
  if(audio) return;
  audio=new (window.AudioContext||window.webkitAudioContext)();
  master=audio.createGain(); master.gain.value=0.24; master.connect(audio.destination);
}
function tone(freq,dur,type="square",vol=0.25,slide=0){
  if(!audio) return;
  const o=audio.createOscillator(), g=audio.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,audio.currentTime);
  if(slide) o.frequency.linearRampToValueAtTime(Math.max(20,freq+slide),audio.currentTime+dur);
  g.gain.setValueAtTime(vol,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+dur);
  o.connect(g); g.connect(master); o.start(); o.stop(audio.currentTime+dur);
}
function noise(dur=0.08,vol=0.2){
  if(!audio) return;
  const n=Math.floor(audio.sampleRate*dur), b=audio.createBuffer(1,n,audio.sampleRate);
  const d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=audio.createBufferSource(),g=audio.createGain();
  s.buffer=b; g.gain.setValueAtTime(vol,audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+dur);
  s.connect(g); g.connect(master); s.start();
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const sign=v=>v<0?-1:v>0?1:0;
function aabb(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}
function box(e){return {x:e.x+e.hb.x,y:e.y+e.hb.y,w:e.hb.w,h:e.hb.h};}
function tileSolid(tx,ty){
  // terreno continuo: un tile es solido si su centro queda bajo la superficie
  return ty*16+8>=groundYAt(tx*16+8);
}
function collideWorld(e,dt){
  const wasGround=e.onGround;
  e.onGround=false;
  e.x+=e.vx*dt;
  e.y+=e.vy*dt;
  const b=box(e);
  const feet=b.y+b.h, gy=groundYAt(b.x+b.w/2);
  // al bajar una pendiente se mantiene pegado al suelo si no esta saltando
  if(e.vy>=0&&(feet>=gy||(wasGround&&gy-feet<7))){
    e.y+=gy-feet; e.vy=0; e.onGround=true;
  }
}
function smooth01(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
// Colinas suaves (pendiente maxima ~0.21); planas al inicio y en la arena del jefe.
function groundYAt(x){
  const hills=Math.sin(x*0.0042)*16+Math.sin(x*0.0093+1.3)*9+Math.sin(x*0.021+0.4)*3;
  const flat=smooth01(80,260,x)*(1-smooth01(2360,2500,x));
  return 184-hills*flat;
}
function dist2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;}

class Bullet extends Entity{
  constructor(x,y,vx,vy,team="player",damage=1,kind="bullet"){
    super(x,y);this.vx=vx;this.vy=vy;this.team=team;this.damage=damage;this.kind=kind;
    this.life=kind==="cannon"?1.8:1.35; this.hb={x:-2,y:-2,w:4,h:4}; this.hitSet=kind==="laser"?new Set():null;
  }
  update(dt){
    if(this.kind==="arc") this.vy+=250*dt;
    this.x+=this.vx*dt;this.y+=this.vy*dt;this.life-=dt;
    if(this.life<=0||this.x<0||this.x>WORLD_W||this.y<-32||this.y>CONFIG.H+80){this.dead=true;return;}
    if(this.y>=groundYAt(this.x)){
      if(this.kind==="cannon"||this.kind==="arc") explode(this.x,this.y,34,this.damage,this.team);
      this.dead=true; impactPuff(this.x,this.y); return;
    }
    handleBulletHit(this);
  }
  draw(cam){
    if(this.kind==="arc"||this.kind==="cannon"){
      const spr=this.kind==="arc"?SPRITES.shell:SPRITES.bullet;
      drawSprite(spr,this.x-cam.x-4,this.y-4,this.kind==="cannon"?2:1,this.vx<0);
      return;
    }
    const sp=Math.hypot(this.vx,this.vy)||1, nx=this.vx/sp, ny=this.vy/sp;
    const enemy=this.team==="enemy", tracer=this.kind==="tracer", laser=this.kind==="laser"||this.kind==="elaser";
    const len=laser?(enemy?14:22):tracer?16:enemy?8:11, x=this.x-cam.x, y=this.y;
    const core=this.kind==="laser"?"220,255,255":this.kind==="elaser"?"255,180,235":enemy?"255,140,110":tracer?"255,200,90":"255,246,200";
    const glow=this.kind==="laser"?"60,200,255":this.kind==="elaser"?"255,40,130":enemy?"255,60,40":tracer?"255,120,30":"255,190,70";
    ctx.save();
    ctx.globalCompositeOperation="lighter"; ctx.lineCap="round";
    ctx.strokeStyle=`rgba(${glow},0.5)`; ctx.lineWidth=laser?5:tracer?4:3;
    ctx.beginPath(); ctx.moveTo(x-nx*len,y-ny*len); ctx.lineTo(x,y); ctx.stroke();
    ctx.strokeStyle=`rgba(${core},1)`; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(x-nx*len*0.6,y-ny*len*0.6); ctx.lineTo(x,y); ctx.stroke();
    ctx.fillStyle=`rgba(${core},1)`; ctx.fillRect(Math.round(x)-1,Math.round(y)-1,2,2);
    ctx.restore();
  }
}

class Particle extends Entity{
  constructor(x,y,vx,vy,life,type="spark"){
    super(x,y);this.vx=vx;this.vy=vy;this.life=life;this.max=life;this.type=type;
  }
  update(dt){
    this.life-=dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(this.type!=="smoke")this.vy+=150*dt;
    if(this.type==="casing"){
      const gy=groundYAt(this.x)-1;
      if(this.y>gy){this.y=gy;this.vy*=-0.34;this.vx*=0.66;}
    }
    if(this.life<=0)this.dead=true;
  }
  draw(cam){
    const a=clamp(this.life/this.max,0,1);
    if(this.type==="smoke") drawSprite(SPRITES.smoke,this.x-cam.x-6,this.y-6,1,false,a);
    else if(this.type==="casing"){
      ctx.globalAlpha=a;ctx.fillStyle=PAL["6"];ctx.fillRect(Math.round(this.x-cam.x),Math.round(this.y),1,2);ctx.globalAlpha=1;
    } else {
      const px=this.x-cam.x, py=this.y, v=Math.hypot(this.vx,this.vy)||1;
      ctx.save();ctx.globalCompositeOperation="lighter";ctx.globalAlpha=a;
      ctx.strokeStyle=Math.random()<.5?"#ffd36b":"#fff4b0";ctx.lineWidth=1.3;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-this.vx/v*4,py-this.vy/v*4);ctx.stroke();
      ctx.restore();

  }
}

class Boomerang extends Entity{
  // sale disparado, frena, y vuelve a la mano del lanzador atravesando enemigos
  constructor(owner,x,y,nx,ny){
    super(x,y); this.owner=owner; this.hb={x:-7,y:-5,w:14,h:10};
    this.vx=nx*250; this.vy=ny*225; this.t=0; this.spin=0; this.returning=false;
    this.hitSet=new Set(); this.trail=[];
  }
  update(dt){
    this.t+=dt; this.spin+=dt*22;
    if(!this.returning){
      const f=Math.pow(0.12,dt); this.vx*=f; this.vy*=f;
      if(this.t>0.42){ this.returning=true; this.hitSet.clear(); }
    } else {
      const ox=this.owner.x+14, oy=this.owner.y+12, dx=ox-this.x, dy=oy-this.y, d=Math.hypot(dx,dy)||1;
      const sp=Math.min(330,120+this.t*260), k=Math.min(1,dt*8);

      if(d<14||this.t>3){ this.dead=true; return; }
    }
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.trail.push([this.x,this.y]); if(this.trail.length>7)this.trail.shift();
    const b=box(this);

      if(e.dead||this.hitSet.has(e)||!aabb(b,box(e)))continue;

        this.hitSet.add(e); e.hurt(2,"shot",sign(this.vx)||1); impactPuff(this.x,this.y);
      } else if(e instanceof Crate){ this.hitSet.add(e); e.hurt(2); }
      else if(e instanceof Hostage&&!e.freed){ e.free(); }
    }

  }
  draw(cam){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    for(let i=0;i<this.trail.length;i++){

      ctx.beginPath(); ctx.arc(tx-cam.x,ty,3+i*0.4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    const img=objImages.boomerang;
    ctx.save(); ctx.translate(this.x-cam.x,this.y); ctx.rotate(this.spin);
    if(imgReady(img)){ ctx.imageSmoothingEnabled=true; ctx.drawImage(img,-10,-10,20,20); }
    else {

      ctx.strokeStyle="rgba(140,230,255,1)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(-8,-6); ctx.lineTo(0,0); ctx.lineTo(-8,6); ctx.stroke();
      ctx.strokeStyle="#fff"; ctx.lineWidth=1.2; ctx.stroke();
    }

  }

// Perro con rig de recorte propio (medido sobre sprite-dog_run.png de 300x300):
// patas y<212..254, sombra del PNG desde y=255 (se recorta y se dibuja aparte).
const DOG_RIG={legTop:212,bodyBot:230,legBot:254,top:47,split:150,hipX:95,shoulderX:215,pivY:208};
function drawDog(img,x,footY,h,flip,phase,run,barkT,t){
  const R=DOG_RIG, sw=img.naturalWidth, k=h/(R.legBot-R.top), w=sw*k;
  ctx.save();
  ctx.globalAlpha=0.26*(1-0.35*Math.abs(Math.sin(phase))*run); ctx.fillStyle="#000";
  ctx.beginPath(); ctx.ellipse(x,footY,w*0.3,2.1,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // galope: rebote en la fase de suspension, balanceo del cuerpo y estiramiento
  const bob=Math.abs(Math.sin(phase))*2.6*run+(barkT>0?2:0);
  const pitch=Math.sin(phase)*0.10*run+(barkT>0?-0.14:0);
  const stretch=1+Math.cos(phase*2)*0.07*run;
  const breathe=run<0.1?1+Math.sin(t*3.2)*0.025:1;
  ctx.save();
  ctx.imageSmoothingEnabled=true;
  ctx.translate(Math.round(x),Math.round(footY-bob));
  if(flip)ctx.scale(-1,1);
  ctx.rotate(pitch);
  ctx.scale(stretch,breathe/stretch);
  const left=-w/2, topY=-R.legBot*k, X=v=>left+v*k, Y=v=>topY+v*k;
  if(run>0.08){
    const swing=Math.sin(phase)*0.38*run;
    // relleno fijo bajo la panza: tapa la cuña que abren las patas al girar
    ctx.drawImage(img,110,R.legTop,80,R.legBot-R.legTop-12,X(110),Y(R.legTop),80*k,(R.legBot-R.legTop-12)*k);
    for(const [sx,ex,px,a] of [[0,R.split,R.hipX,-swing],[R.split,sw,R.shoulderX,swing]]){
      ctx.save();
      const PX=X(px), PY=Y(R.pivY);
      ctx.translate(PX,PY); ctx.rotate(a); ctx.translate(-PX,-PY);
      ctx.drawImage(img,sx,R.legTop,ex-sx,R.legBot-R.legTop,X(sx),Y(R.legTop),(ex-sx)*k,(R.legBot-R.legTop)*k);
      ctx.restore();
    }
    ctx.drawImage(img,0,0,sw,R.bodyBot,left,topY,w,R.bodyBot*k);
  } else {
    ctx.drawImage(img,0,0,sw,R.legBot,left,topY,w,R.legBot*k);
  }
  ctx.restore();
}

// Rig del tanque (px del PNG 300x300): torreta y casco se recortan por separado
const TANK_RIG={turretBot:146,pivX:130,pivY:140,hullTop:136,hullBot:206,wheelTop:198,
  wheels:[[45,222,22],[92,230,17],[131,230,17],[170,230,17],[224,222,22]],treadY:259,treadX0:40,treadX1:236};
function drawTankRig(img,cx,footY,h,faceLeft,o){
  if(!imgReady(img))return false;
  const R=TANK_RIG, k=h/300, X=v=>(v-150)*k, Y=v=>(v-300)*k, bob=o.bob||0, tr=o.tread||0;
  ctx.save(); ctx.imageSmoothingEnabled=true;
  ctx.translate(Math.round(cx),Math.round(footY)); ctx.rotate(o.pitch||0); if(faceLeft)ctx.scale(-1,1);
  ctx.filter=o.filter||"none";
  ctx.save(); ctx.translate(X(R.pivX),Y(R.pivY)+bob); ctx.rotate(-(o.turret||0)); ctx.translate(-(o.recoil||0)*2.5,0);
  ctx.drawImage(img,0,0,300,R.turretBot,-R.pivX*k,-R.pivY*k,300*k,R.turretBot*k); ctx.restore();
  ctx.drawImage(img,0,R.wheelTop,300,300-R.wheelTop,X(0),Y(R.wheelTop),300*k,(300-R.wheelTop)*k);
  ctx.drawImage(img,0,R.hullTop,300,R.hullBot-R.hullTop,X(0),Y(R.hullTop)+bob,300*k,(R.hullBot-R.hullTop)*k);
  ctx.filter="none";
  // eslabones de oruga que avanzan y radios de rueda que giran
  const seg=k*9; ctx.lineWidth=Math.max(0.9,k*6); ctx.setLineDash([seg,seg]);
  ctx.lineDashOffset=-tr; ctx.strokeStyle="rgba(25,15,6,0.8)";
  ctx.beginPath(); ctx.moveTo(X(R.treadX0),Y(R.treadY)); ctx.lineTo(X(R.treadX1),Y(R.treadY)); ctx.stroke();
  ctx.lineDashOffset=-tr+seg; ctx.strokeStyle="rgba(255,225,160,0.35)";
  ctx.beginPath(); ctx.moveTo(X(R.treadX0),Y(R.treadY)); ctx.lineTo(X(R.treadX1),Y(R.treadY)); ctx.stroke();
  ctx.setLineDash([]); ctx.strokeStyle="rgba(35,22,8,0.75)"; ctx.lineWidth=Math.max(0.7,k*4);
  for(const [wx,wy,wr] of R.wheels){
    const a=tr/(wr*k), r=wr*k*0.72;
    for(let i=0;i<3;i++){ const b=a+i*Math.PI/3, dx=Math.cos(b)*r, dy=Math.sin(b)*r;
      ctx.beginPath(); ctx.moveTo(X(wx)-dx,Y(wy)-dy+bob*0.3); ctx.lineTo(X(wx)+dx,Y(wy)+dy+bob*0.3); ctx.stroke(); }
  }
  ctx.restore(); return true;
}
function drawFlames(x,y,n,t,scale=1){
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(let i=0;i<n;i++){
    const fx=x+(i-(n-1)/2)*6*scale, h=(5+Math.sin(t*20+i*2.1)*2+Math.random()*2)*scale, w=2.6*scale;
    ctx.fillStyle="rgba(255,120,30,0.75)"; ctx.beginPath(); ctx.moveTo(fx-w,y); ctx.quadraticCurveTo(fx,y-h*1.4,fx+w,y); ctx.fill();
    ctx.fillStyle="rgba(255,230,120,0.8)"; ctx.beginPath(); ctx.moveTo(fx-w*.5,y); ctx.quadraticCurveTo(fx,y-h*.8,fx+w*.5,y); ctx.fill();
  }
  ctx.restore();
}
function tankLife(v,dt,faceDir,dmgPct){
  // comun a tanques: orugas, cabeceo por aceleracion, humo de escape, polvo y humo de dano
  v.t=(v.t||0)+dt; v.tread=(v.tread||0)+v.vx*dt*faceDir;
  const acc=(v.vx-(v.prevVx||0))/Math.max(dt,1e-3); v.prevVx=v.vx;
  v.sway=(v.sway||0)+(clamp(-acc*0.0035,-0.07,0.07)-(v.sway||0))*Math.min(1,dt*6);
  v.exT=(v.exT||0)-dt;
  if(v.exT<=0){ v.exT=Math.abs(v.vx)>5?0.09:0.35;
    particles.push(new Particle(v.x+22-faceDir*21,v.y+13,-faceDir*rnd(8,20),rnd(-18,-6),rnd(.4,.7),"smoke")); }
  if(Math.abs(v.vx)>8&&Math.random()<dt*10)
    particles.push(new Particle(v.x+22-sign(v.vx)*18,groundYAt(v.x+22)-2,-sign(v.vx)*rnd(10,30),rnd(-16,-4),.45,"smoke"));
  if(dmgPct<.6&&Math.random()<dt*4)particles.push(new Particle(v.x+rnd(10,34),v.y+rnd(8,16),rnd(-5,5),rnd(-30,-12),.8,"smoke"));
  if(dmgPct<.35&&Math.random()<dt*8){ particles.push(new Particle(v.x+rnd(10,34),v.y+12,rnd(-50,50),rnd(-90,-30),.25)); addLight(v.x+22,v.y+12,rnd(20,30),"255,140,50",.05); }
}

  }

    if(this.hp<=0){this.deathType=kind;this.kill();}
  }
  kill(){
    this.dead=true;game.score+=this.type==="rifle"?250:150;

  }

    if(this.dead)return;

    this.speed=team==="player"?90:55; this.hb={x:-4,y:-3,w:8,h:6}; this.life=team==="player"?2.2:3.2; this.smokeT=0;
  }

    if(this.homing>0&&player){
      const dx=player.x+14-this.x, dy=player.y+14-this.y, d=Math.hypot(dx,dy)||1, k=Math.min(1,this.homing*dt);
      this.nx+=(dx/d-this.nx)*k; this.ny+=(dy/d-this.ny)*k; const m=Math.hypot(this.nx,this.ny)||1; this.nx/=m; this.ny/=m;

    addLight(this.x-this.nx*9,this.y-this.ny*9,16,"255,160,60",0.03);
    if(this.life<=0||this.y>=groundYAt(this.x)-1||this.x<0||this.x>WORLD_W){this.boom();return;}
    const b=box(this);

    else if(aabb(b,box(player.inTank||player))){this.boom();}

function aimVector(facing,L,R,U,D){
  let x=facing,y=0;
  if(U||D){
    y=U?-1:1;
    if(L)x=-1; else if(R)x=1; else x=0;
  } else if(L||R){
    x=L?-1:1;
  }
  const m=Math.hypot(x,y)||1;return{x:x/m,y:y/m};
}

/* ============================================================
   COMBATE
   ============================================================ */
function isHostile(e){ return e instanceof Enemy||e instanceof Turret||e instanceof Boss||e instanceof EnemyTank||e.hostile===true; }
function enemyShoot(e){
  const dx=(player.x+14)-(e.x+14),dy=(player.y+12)-(e.y+10),m=Math.hypot(dx,dy)||1;
  entities.push(new Bullet(e.x+14,e.y+10,dx/m*150,dy/m*150,"enemy",1));casing(e.x+12,e.y+8,sign(dx)||1);SFX.shot();
  addLight(e.x+14+sign(dx)*10,e.y+10,22,"255,170,80",0.06);muzzleFlash(e.x+14+sign(dx)*10,e.y+10,sign(dx)||1,0,5);
}
// El escudo solo bloquea lo que llega por delante del jugador.
function shieldBlocks(fromX,cost){
  if(!player||!player.shieldOn||player.inTank) return false;
  if((fromX-(player.x+14))*player.facing < -6) return false;
  if(!(player.shieldBoost>0))player.shield=Math.max(0,player.shield-cost); player.shieldFlash=0.14;
  if(player.shield<=0){player.shieldOn=false;SFX.shieldBreak();} else SFX.shieldHit();
  return true;
}
function enemyMelee(e){
  if(player.inTank || Math.abs(player.x-e.x)>=26 || Math.abs(player.y-e.y)>=32) return;
  if(shieldBlocks(e.x+14,CONFIG.SHIELD.hitCost)) e.hurt(0,"shot",sign(player.x-e.x)||1);
  else player.die();
}
function melee(p){
  const kb={x:p.x+(p.facing>0?18:-14),y:p.y+3,w:24,h:26};
  for(const e of entities){
    if(e.dead)continue;
    if(e instanceof Enemy && aabb(kb,box(e)))e.hurt(99,"knife",p.facing);
    else if(e.hostile && aabb(kb,box(e)))e.hurt(3,"knife",p.facing);
    if(e instanceof Hostage && !e.freed && aabb(kb,box(e)))e.free();
    if(e instanceof Crate && aabb(kb,box(e)))e.hurt(2);
  }
}
function handleBulletHit(b){
  if(b.team==="player"){
    for(const e of entities){
      if(e.dead||e===b)continue;
      if((isHostile(e)||e instanceof Crate) && aabb(box(b),box(e))){
        if(b.kind==="laser"){ if(b.hitSet.has(e))continue; b.hitSet.add(e); }
        if(e instanceof Crate)e.hurt(b.damage); else e.hurt(b.damage,b.kind==="cannon"?"explosion":"shot",sign(b.vx));
        impactPuff(b.x,b.y); if(b.kind!=="laser"){b.dead=true;return;}
      }
    }
  }else{
    if(player.inTank){
      if(aabb(box(b),box(player.inTank))){player.inTank.hurt(1);b.dead=true;return;}
    }else if(aabb(box(b),box(player))){b.dead=true; if(shieldBlocks(b.x-b.vx*0.05,CONFIG.SHIELD.hitCost)){impactPuff(b.x,b.y);addLight(b.x,b.y,20,"120,220,255",0.08);} else player.die();}
  }

function explode(x,y,r,dmg,team="player",visual=true){
  if(visual!==false)entities.push(new Explosion(x,y,r>35));SFX.boom();shake(r>35?6:3,r>35?.18:.09);
  addLight(x,y,r*2.4,"255,170,60",r>35?0.45:0.3);
  flashScreen(r>35?0.5:0.22);
  for(let i=0;i<8;i++)particles.push(new Particle(x,y,rnd(-90,90),rnd(-120,20),rnd(.25,.7),Math.random()<.35?"smoke":"spark"));

  if(team==="enemy"){
    const target=player.inTank?player.inTank:player;
    if(target){
      const tb=box(target),tx=tb.x+tb.w/2,ty=tb.y+tb.h/2;
      if((tx-x)*(tx-x)+(ty-y)*(ty-y)<=r*r){
        if(player.inTank)player.inTank.hurt(1); else if(!shieldBlocks(x,CONFIG.SHIELD.blastCost)) player.die();
      }
    }
    return;
  }

  for(const e of entities){
    if(e.dead)continue;
    const eb=box(e),ex=eb.x+eb.w/2,ey=eb.y+eb.h/2;
    if((ex-x)*(ex-x)+(ey-y)*(ey-y)<=r*r){
      if(e instanceof Enemy)e.hurt(dmg,"explosion",sign(ex-x));
      else if(isHostile(e))e.hurt(dmg,"explosion",sign(ex-x));
      else if(e instanceof Crate)e.hurt(dmg);
    }
  }
}
function impactPuff(x,y){
  for(let i=0;i<7;i++){const a=rnd(0,Math.PI*2),v=rnd(40,120);particles.push(new Particle(x,y,Math.cos(a)*v,Math.sin(a)*v-30,rnd(.12,.3)));}

  addLight(x,y,16,"255,200,120",0.06);
}

let lights=[], screenFlash=0;

/* ============================================================
   ACTUALIZACIÓN
   ============================================================ */
function update(dt){
  musicTick(dt);
  updateWind(dt);
  if(hit("p")&&game.state==="PLAY")game.paused=!game.paused;
  if(game.state==="TITLE"){
    if(hit("s","z","enter"))game.state="CHARSELECT";
    clearPressed();return;
  }
  if(game.state==="CHARSELECT"){
    if(hit("arrowleft"))game.charIndex=(game.charIndex+heroImages.length-1)%heroImages.length;
    if(hit("arrowright"))game.charIndex=(game.charIndex+1)%heroImages.length;
    if(hit("s","z","enter"))startGame(true);
    if(hit("escape","x"))game.state="TITLE";
    clearPressed();return;
  }
  if(game.state==="GAMEOVER"){
    if(hit("s","z","enter"))continueGame();
    clearPressed();return;
  }
  if(game.state==="RESULTS"){
    if(hit("s","z","enter"))game.state="TITLE";
    clearPressed();return;
  }
  if(game.paused){clearPressed();return;}

  game.runTime+=dt;
  updateLights(dt);
  player.update(dt);
  for(const e of entities) if(!e.dead)e.update(dt);
  for(const p of particles) if(!p.dead)p.update(dt);
  for(const m of mortars) if(!m.dead)m.update(dt);
  entities=entities.filter(e=>!e.dead);particles=particles.filter(p=>!p.dead);mortars=mortars.filter(m=>!m.dead);

  // Checkpoints
  if(player.x>900)game.checkpoint=Math.max(game.checkpoint,900);
  if(player.x>1750)game.checkpoint=Math.max(game.checkpoint,1750);

  // Emboscada: oleadas desde ambos lados y morteros
  if(player.x>CONFIG.WORLD.ambushStart && player.x<CONFIG.WORLD.ambushEnd && !boss){
    ambushSpawnTimer-=dt;
    if(ambushSpawnTimer<=0 && ambushCount<12){
      ambushSpawnTimer=.8;ambushCount++;
      const side=ambushCount%2?1:-1;
      if(ambushCount%4===0)entities.push(new Drone(player.x+side*200,groundYAt(player.x)-90));
      else if(ambushCount%5===0)entities.push(new Robot(player.x+side*190,groundYAt(player.x+side*190)-40));
      else entities.push(new Enemy(player.x+side*190,150,ambushCount%3===0?"rifle":"runner"));
      if(ambushCount%2===0)mortars.push(new MortarWarning(clamp(player.x+rnd(-70,70),CONFIG.WORLD.ambushStart,CONFIG.WORLD.ambushEnd)));
    }
  }

  // Jefe
  if(player.x>CONFIG.WORLD.bossTrigger && !boss){
    boss=new Boss(2680,groundYAt(2716)-54);entities.push(boss);SFX.boss();
  }

  // Cámara
  let target=player.x-110;
  if(boss)target=clamp(target,CONFIG.WORLD.bossTrigger-70,WORLD_W-CONFIG.W);
  cam.x+=clamp(target-cam.x,-150*dt,150*dt);cam.x=clamp(cam.x,0,WORLD_W-CONFIG.W);
  if(cam.shakeT>0){cam.shakeT-=dt;cam.sx=rnd(-cam.shakeMag,cam.shakeMag);cam.sy=rnd(-cam.shakeMag,cam.shakeMag);}
  else{cam.sx=cam.sy=0;cam.shakeMag=0;}

  clearPressed();
}

/* ============================================================
   VIENTO: rafagas que mecen palmeras y pasto, paja voladora y plantas rodadoras

const WIND={t:0,bits:[],weedT:3};
function windAt(t){ return clamp(0.45+0.3*Math.sin(t*0.37)+0.22*Math.sin(t*1.13+1.7)+0.12*Math.sin(t*2.9),0,1); }
const PALMS=[[40,1],[150,.9],[330,1.1],[545,.95],[690,1.05],[905,.9],[1090,1.1],[1235,1],[1420,.85],[1760,.9],[2140,.85],[2400,1]];
const FAR_PALMS=[[60,.55],[230,.5],[410,.6],[620,.5],[800,.55],[1010,.5],[1180,.6],[1320,.45]];
function updateWind(dt){
  WIND.t+=dt; const w=windAt(WIND.t), right=cam.x+CONFIG.W;
  if(Math.random()<dt*(3+w*14)&&WIND.bits.length<60)
    WIND.bits.push({x:right+rnd(0,20),y:rnd(50,205),vx:-(60+w*150)*rnd(.7,1.2),vy:rnd(-10,10),rot:rnd(0,6),spin:rnd(-9,9),len:rnd(2,5),leaf:Math.random()<.3,ph:rnd(0,6),life:7});
  WIND.weedT-=dt;
  if(WIND.weedT<=0){ WIND.weedT=rnd(6,12);
    if(zoneBlend(cam.x+CONFIG.W/2)<0.7) WIND.bits.push({weed:true,x:right+20,y:groundYAt(right+20)-8,vx:-90,vy:0,rot:0,r:rnd(5,8),life:12}); }
  for(const b of WIND.bits){
    b.life-=dt;
    if(b.weed){
      b.vx+=(-(60+w*120)-b.vx)*Math.min(1,dt*1.5); b.vy+=320*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.vx*dt/b.r;
      const g=groundYAt(b.x)-b.r; if(b.y>g){ b.y=g; b.vy=-Math.abs(b.vy)*0.45-(Math.random()<0.35?rnd(40,100):0); }
    } else {
      b.vx+=(-(60+w*150)-b.vx)*Math.min(1,dt*0.8); b.vy+=Math.sin(WIND.t*3+b.ph)*40*dt;
      b.x+=b.vx*dt; b.y+=b.vy*dt; b.rot+=b.spin*dt;
      const g=groundYAt(b.x)-1; if(b.y>g){ b.y=g; b.vy=-rnd(10,45); }
    }
  }
  WIND.bits=WIND.bits.filter(b=>b.life>0&&b.x>cam.x-40);
}
function alphaBox(img){
  if(img._abox)return img._abox;
  const c=document.createElement("canvas"); c.width=img.naturalWidth; c.height=img.naturalHeight;
  const g=c.getContext("2d"); g.drawImage(img,0,0); const d=g.getImageData(0,0,c.width,c.height).data;
  let x0=c.width,y0=c.height,x1=0,y1=0;
  for(let y=0;y<c.height;y+=2)for(let x=0;x<c.width;x+=2){ if(d[(y*c.width+x)*4+3]>128){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  return img._abox={x0,y0,x1,y1};
}
// palmera con rig: el tronco se inclina con un sesgo desde la base y la copa gira y aletea sobre la punta
function drawPalm(img,x,baseY,h,flip,ph,filter,alpha=1){
  const t=WIND.t, w=windAt(t+ph*0.3), base=380, pivX=147, pivY=212, trunkX=121, k=h/352, sw=img.naturalWidth;
  const sway=-(0.03+0.11*w)*(0.55+0.45*Math.sin(t*1.7+ph))-0.025*Math.sin(t*4.3+ph*2)*w;
  const s=-sway*0.6, X=v=>(v-trunkX)*k, Y=v=>(v-base)*k;
  ctx.save(); ctx.imageSmoothingEnabled=true; ctx.globalAlpha=alpha; if(filter)ctx.filter=filter;
  ctx.translate(Math.round(x),Math.round(baseY));
  ctx.save(); ctx.transform(1,0,s,1,0,0); if(flip)ctx.scale(-1,1);
  ctx.drawImage(img,0,200,sw,200,X(0),Y(200),sw*k,200*k); ctx.restore();
  ctx.translate((flip?-1:1)*X(pivX)+s*Y(pivY),Y(pivY)); ctx.rotate(sway); if(flip)ctx.scale(-1,1);
  ctx.scale(1+0.03*w*Math.sin(t*6.5+ph),1-0.02*w*Math.sin(t*5.1+ph));
  ctx.drawImage(img,0,0,sw,216,-pivX*k,-pivY*k,sw*k,216*k);
  ctx.restore();
}
function drawFarPalms(){
  const img=objImages.palm; if(!imgReady(img))return;
  const fade=1-zoneBlend(cam.x+CONFIG.W/2); if(fade<=0.02)return;
  for(const [wx,sc] of FAR_PALMS){
    const sx=wx-cam.x*0.55; if(sx<-60||sx>CONFIG.W+60)continue;
    drawPalm(img,sx,158+(wx%7),110*sc,(wx%3)===0,wx*0.01,"brightness(0.78) saturate(0.75)",0.9*fade);
  }
}
function drawPalmsAndGrass(){
  const pimg=objImages.palm, gimg=objImages.grass, t=WIND.t;
  if(imgReady(pimg)) for(const [wx,sc] of PALMS){
    const sx=wx-cam.x; if(sx<-70||sx>CONFIG.W+70)continue;
    drawPalm(pimg,sx,groundYAt(wx)+3,104*sc,(wx%2)===0,wx*0.013,zoneBlend(wx)>0.5?"saturate(0.7) brightness(0.9)":null);
  }
  // matas de pasto seco cada ~46 px, dobladas por la rafaga
  const start=Math.floor((cam.x-20)/46)*46;
  for(let wx=start;wx<cam.x+CONFIG.W+20;wx+=46){
    const hsh=Math.abs(Math.sin(wx*12.9898)*43758.5453)%1; if(hsh<0.35)continue;
    const sx=wx+hsh*20-cam.x, gy=groundYAt(wx+hsh*20)+2, w=windAt(t+wx*0.002);
    const bend=(0.18+0.4*w)*(0.75+0.25*Math.sin(t*3.2+wx*0.05));
    const hgt=9+hsh*7, desert=zoneBlend(wx)<0.6;
    ctx.save(); ctx.translate(Math.round(sx),gy); ctx.transform(1,0,bend,1,0,0);
    if(imgReady(gimg)){
      const bx=alphaBox(gimg), bw=bx.x1-bx.x0, bh=bx.y1-bx.y0, kk=hgt/bh;
      if(!desert)ctx.filter="saturate(0.5) brightness(0.8)";
      ctx.imageSmoothingEnabled=true; ctx.drawImage(gimg,bx.x0,bx.y0,bw,bh,-bw*kk/2,-hgt,bw*kk,hgt);
    } else {
      ctx.strokeStyle=desert?"#d9b560":"#9b9a78"; ctx.lineWidth=1;
      for(let i=0;i<6;i++){ const ox=(i-2.5)*1.6; ctx.beginPath(); ctx.moveTo(ox,0); ctx.quadraticCurveTo(ox,-hgt*0.6,ox+(i-2.5)*0.8,-hgt*(0.7+((i*37)%5)/15)); ctx.stroke(); }
    }
    ctx.restore();
  }
}
function drawWindBits(cam){
  const wimg=objImages.tumbleweed;
  for(const b of WIND.bits){
    const x=b.x-cam.x;
    if(b.weed){
      const g=groundYAt(b.x), a=clamp(1-(g-b.y-b.r)/40,0.1,0.35);
      ctx.save(); ctx.globalAlpha=a; ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(x,g,b.r*0.9,1.6,0,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(x,b.y); ctx.rotate(b.rot);
      if(imgReady(wimg)){ const bx=alphaBox(wimg); ctx.imageSmoothingEnabled=true; ctx.drawImage(wimg,bx.x0,bx.y0,bx.x1-bx.x0,bx.y1-bx.y0,-b.r,-b.r,b.r*2,b.r*2); }
      else { ctx.strokeStyle="#8a6a3a"; ctx.lineWidth=1; for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(0,0,b.r*(0.5+i*0.12),i,i+4); ctx.stroke(); } }
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(x,b.y); ctx.rotate(b.rot); ctx.globalAlpha=clamp(b.life,0,0.9);
      if(b.leaf){ ctx.fillStyle="#a07d3c"; ctx.fillRect(-1.5,-1,3,2); }
      else { ctx.strokeStyle="#ecd18a"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(-b.len/2,0); ctx.lineTo(b.len/2,0); ctx.stroke(); }
      ctx.restore();
    }
  }
}
const SCENERY=[
  [210,"barrel"],[268,"sandbags"],[480,"sandbags"],[700,"barrel"],[760,"barrel"],
  [980,"sandbags"],[1150,"barrel"],[1340,"sandbags"],[1600,"barrel"],[1660,"sandbags"],
  [1880,"barrel"],[2100,"sandbags"],[2260,"barrel"],[2420,"sandbags"]
];
function drawScenery(){
  drawPalmsAndGrass();
  for(const [wx,kind] of SCENERY){
    const sx=wx-cam.x;
    if(sx<-40||sx>CONFIG.W+40) continue;
    const img=objImages[kind];
    if(!imgReady(img)) continue;
    const h=kind==="barrel"?26:20;
    drawCharImg(img,sx,groundYAt(wx),h,(wx%97)<48);
  }
}
const groundPatterns={};
function groundPattern(z){
  const img=groundImages[z];
  if(!imgReady(img)) return null;
  if(!groundPatterns[z]) groundPatterns[z]=ctx.createPattern(img,"repeat");
  const pat=groundPatterns[z];
  // textura a 1/3 y anclada al mundo, para que el suelo no patine con la camara
  pat.setTransform(new DOMMatrix().translateSelf(-cam.x,0).scaleSelf(1/3,1/3));
  return pat;
}
function traceSurface(close){
  const x0=cam.x-8, x1=cam.x+CONFIG.W+8;
  ctx.beginPath();
  if(close) ctx.moveTo(x0-cam.x,CONFIG.H+2);
  for(let wx=x0;wx<=x1;wx+=4){
    const sy=groundYAt(wx);
    if(!close&&wx===x0) ctx.moveTo(wx-cam.x,sy); else ctx.lineTo(wx-cam.x,sy);
  }
  if(close){ ctx.lineTo(x1-cam.x,CONFIG.H+2); ctx.closePath(); }
}
function drawGround(){
  const t=zoneBlend(cam.x+CONFIG.W/2);
  ctx.save();
  traceSurface(true);
  ctx.fillStyle=groundPattern(1)||PAL["3"]; ctx.fill();
  if(t>0){ ctx.globalAlpha=t; ctx.fillStyle=groundPattern(2)||PAL["L"]; ctx.fill(); ctx.globalAlpha=1; }
  const depth=ctx.createLinearGradient(0,150,0,CONFIG.H);
  depth.addColorStop(0,"rgba(60,30,10,0)"); depth.addColorStop(1,"rgba(40,20,8,0.42)");
  ctx.fillStyle=depth; ctx.fill();
  ctx.restore();
  ctx.save();
  traceSurface(false);
  ctx.lineWidth=2.5; ctx.strokeStyle="rgba(255,236,190,0.6)"; ctx.stroke();
  ctx.translate(0,3); ctx.lineWidth=2; ctx.strokeStyle="rgba(70,40,15,0.32)"; ctx.stroke();
  ctx.restore();
}
function drawForeground(){
  drawGround();
  drawScenery();
}
function render(){
  ctx.save();
  ctx.translate(Math.round(cam.sx),Math.round(cam.sy));
  drawSky();drawMidground();drawFarPalms();drawForeground();
  for(const m of mortars)m.draw(cam);
  // Orden simple por y
  const renderList=entities.slice().sort((a,b)=>a.y-b.y);
  for(const e of renderList)e.draw(cam);
  player?.draw(cam);
  drawWindBits(cam);
  for(const p of particles)p.draw(cam);
  drawLights(cam);
  ctx.restore();
  drawScreenFlash();
  drawHUD();
  if(game.state==="TITLE")drawTitle();
  if(game.state==="CHARSELECT")drawCharSelect();
  if(game.state==="GAMEOVER")drawGameOver();
  if(game.state==="RESULTS")drawResults();
  if(game.paused){
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
    drawPanel(140,90,104,34,PAL["I"]);
    cornerBracket(140,90,104,34,PAL["6"],6);
    textPx("PAUSA",CONFIG.W/2+1,105,3,PAL["G"],"center");
    textPx("PAUSA",CONFIG.W/2,104,3,PAL["K"],"center");
  }
  crtOverlay();
}
function drawHUD(){
  if(game.state!=="PLAY")return;
  if(game.runTime<8&&!game.paused){
    // recordatorio de controles los primeros segundos de partida
    const a=clamp((8-game.runTime)/1.2,0,1), y=CONFIG.H-19;
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle="rgba(10,6,4,.7)"; ctx.fillRect(8,y-3,CONFIG.W-16,15);
    let x=16;
    for(const [ks,label] of [[["<",">"],"MOVER"],[["^"],"SALTAR"],[["S"],"DISPARAR"],[["A"],"ESCUDO"],[["C"],"GRANADA"]]){
      for(const k of ks)x+=keyCap(x,y,k)+2;
      textPx(label,x+2,y+3,1,PAL["7"]); x+=label.length*4+12;
    }
    ctx.restore();
  }
  const barH=20;
  drawPanel(0,0,CONFIG.W,barH,PAL["I"]);
  cornerBracket(0,0,CONFIG.W,barH,PAL["6"],5);
  ctx.fillStyle=PAL["1"];
  for(const dx of [58,118,172]) ctx.fillRect(dx,3,1,barH-6);

  drawSprite(SPRITES.icon_medal,4,3,2);
  textPx("x"+Math.max(0,player.lives),22,6,1,PAL["7"]);

  const heavyAmmo=player.rocketAmmo||player.laserAmmo||player.special||player.rifleAmmo;
  const wIcon=player.rocketAmmo>0?objImages.wRocket:player.laserAmmo>0?objImages.wLaser:null;
  if(wIcon&&imgReady(wIcon)){ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(wIcon,62,1,20,20);ctx.restore();}
  else drawSprite(SPRITES.item,66,4,2);
  textPx(heavyAmmo>0?("x"+heavyAmmo):"---",86,6,1,heavyAmmo>0?PAL["K"]:PAL["M"]);

  drawSprite(SPRITES.grenade,126,4,3);
  textPx("x"+player.grenades,142,6,1,PAL["J"]);

  drawSprite(SPRITES.icon_star,178,3,2);
  textPx("x"+game.hostages,196,6,1,PAL["W"]);

  cornerBracket(54,1,124,barH-4,PAL["M"],3);
  textPx(String(game.score).padStart(7,"0"),CONFIG.W-6,4,2,PAL["K"],"right");

  if(player.inTank){
    drawPanel(4,barH+3,96,13,PAL["B"]);
    textPx("BLINDADO "+player.inTank.armor,8,barH+6,1,PAL["F"]);
  }
  if(boss&&!boss.dead){
    const bx=84,by=barH+3,bw=216,bh=11;
    drawPanel(bx,by,bw,bh,PAL["G"]);
    ctx.fillStyle=PAL["1"];ctx.fillRect(bx+3,by+3,bw-6,bh-6);
    const pct=clamp(boss.hp/boss.max,0,1);
    const low=pct<0.25&&blinkOn();
    ctx.fillStyle=low?PAL["K"]:PAL["J"];
    ctx.fillRect(bx+3,by+3,(bw-6)*pct,bh-6);
    drawSprite(SPRITES.icon_skull,bx-12,by,2);
    textPx("JEFE",CONFIG.W/2,by-7,1,PAL["7"],"center");
  }
}
function drawTitle(){
  ctx.fillStyle="rgba(10,6,4,.55)";ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  hazardStripes(0,0,CONFIG.W,6,1);

  textPx("BATTALION",CONFIG.W/2,52,3,PAL["7"],"center");
  if(blinkOn())textPx("PULSA S O ENTER PARA EMPEZAR",CONFIG.W/2,76,1,PAL["J"],"center");

  const px=18, py=88, pw=CONFIG.W-36, ph=122;
  drawPanel(px,py,pw,ph,PAL["D"]);
  cornerBracket(px,py,pw,ph,PAL["F"],6);
  textPx("CONTROLES",CONFIG.W/2+1,py+6,2,PAL["1"],"center");
  textPx("CONTROLES",CONFIG.W/2,py+5,2,PAL["K"],"center");
  const rows=[
    [[["<"],[">"]],"MOVERSE",   [["^"]],"SALTAR"],
    [[["S"]],"DISPARAR",        [["A"]],"ESCUDO"],
    [[["v"]],"AGACHARSE",       [["C"]],"GRANADA"],

  ];
  rows.forEach((r,i)=>{

    for(const [keysList,label,cx] of [[r[0],r[1],px+14],[r[2],r[3],px+pw/2+10]]){
      let x=cx;
      for(const [k] of keysList){ x+=keyCap(x,y,k)+3; }

  });
  const tips=[
    "TOCA A LOS REHENES PARA LIBERARLOS",
    "CAJAS Y REHENES SUELTAN ARMAS Y POWER UPS",
    "CAMINA HASTA EL TANQUE PARA SUBIRTE",
    "JUAN JOSE LANZA SU BOOMERANG CON S",
    "EL ESCUDO SOLO PROTEGE POR DELANTE"
  ];
  const tip=tips[Math.floor(performance.now()/3200)%tips.length];
  ctx.fillStyle=PAL["1"]; ctx.fillRect(px+8,py+ph-22,pw-16,13);
  textPx("TIP",px+14,py+ph-18,1,PAL["J"]);
  textPx(tip,CONFIG.W/2+8,py+ph-18,1,PAL["W"],"center");

// tecla dibujada: caja con relieve; "<" ">" "^" "v" se dibujan como flechas
function keyCap(x,y,label){
  const arrow="<>^v".includes(label)&&label.length===1;
  const w=arrow?11:Math.max(11,label.length*4+6), h=11;
  ctx.fillStyle=PAL["0"]; ctx.fillRect(x,y+1,w,h);
  ctx.fillStyle=PAL["O"]; ctx.fillRect(x,y,w,h-1);
  ctx.fillStyle=PAL["N"]; ctx.fillRect(x+1,y+h-3,w-2,2);
  ctx.fillStyle=PAL["1"];
  if(arrow){
    const cx=x+w/2, cy=y+4.5; ctx.beginPath();
    if(label==="<"){ctx.moveTo(cx-3,cy);ctx.lineTo(cx+2,cy-3);ctx.lineTo(cx+2,cy+3);}
    if(label===">"){ctx.moveTo(cx+3,cy);ctx.lineTo(cx-2,cy-3);ctx.lineTo(cx-2,cy+3);}
    if(label==="^"){ctx.moveTo(cx,cy-3);ctx.lineTo(cx-3,cy+2);ctx.lineTo(cx+3,cy+2);}
    if(label==="v"){ctx.moveTo(cx,cy+3);ctx.lineTo(cx-3,cy-2);ctx.lineTo(cx+3,cy-2);}
    ctx.closePath(); ctx.fill();
  } else textPx(label,x+w/2,y+2,1,PAL["1"],"center");
  return w;
}
function drawCharSelect(){
  ctx.fillStyle=PAL["0"];ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  hazardStripes(0,0,CONFIG.W,6,1);
  hazardStripes(0,CONFIG.H-6,CONFIG.W,6,1);
  textPx("SELECCIONA TU HEROE",CONFIG.W/2+1,15,2,PAL["G"],"center");
  textPx("SELECCIONA TU HEROE",CONFIG.W/2,14,2,PAL["K"],"center");

  const n=heroImages.length, gap=8, boxW=Math.min(100,Math.floor((CONFIG.W-28-(n-1)*gap)/n));
  const totalW=boxW*n+gap*(n-1);
  const startX=(CONFIG.W-totalW)/2, boxY=36, boxH=148;

  for(let i=0;i<n;i++){
    const bx=startX+i*(boxW+gap);
    const sel=i===game.charIndex;
    const accent=sel?PAL["K"]:PAL["M"];
    drawPanel(bx,boxY,boxW,boxH,accent);
    cornerBracket(bx-(sel?2:0),boxY-(sel?2:0),boxW+(sel?4:0),boxH+(sel?4:0),accent,sel?7:4);
    const hc=heroImages[i];
    if(hc&&imgReady(hc.run))drawCharImg(hc.run,bx+boxW/2,boxY+116,80,false,sel?performance.now()/1000*5.5:0,sel);
    textPx(hc?hc.name:"?",bx+boxW/2,boxY+boxH-13,1,sel?PAL["K"]:PAL["7"],"center");
    if(sel){
      const arrowY=boxY+boxH/2;
      if(blinkOn()){
        textPx("<",bx-8,arrowY,1,PAL["K"],"right");
        textPx(">",bx+boxW+8,arrowY,1,PAL["K"]);
      }
    }
  }
  if(blinkOn())textPx("S CONFIRMAR",CONFIG.W/2,CONFIG.H-16,1,PAL["J"],"center");
  textPx("ESC VOLVER",CONFIG.W/2,CONFIG.H-28,1,PAL["7"],"center");
}
function drawGameOver(){
  ctx.fillStyle="rgba(10,4,3,.72)";ctx.fillRect(0,0,CONFIG.W,CONFIG.H);
  hazardStripes(0,0,CONFIG.W,5,1);
  hazardStripes(0,CONFIG.H-5,CONFIG.W,5,1);

  textPx("GAME OVER",CONFIG.W/2+1,101,4,PAL["G"],"center");
  textPx("GAME OVER",CONFIG.W/2,100,4,PAL["H"],"center");

    textPx("CONTINUAR "+game.continues,CONFIG.W/2,134,2,PAL["K"],"center");

function drawResults(){

  textPx("REHENES "+game.hostages,CONFIG.W/2,118,2,PAL["W"],"center");
  const t=Math.floor(game.clearTime),m=Math.floor(t/60),s=String(t%60).padStart(2,"0");
  textPx("TIEMPO "+m+":"+s,CONFIG.W/2,140,2,PAL["J"],"center");

/* ============================================================
   LOOP FIJO 60 FPS LÓGICOS
   ============================================================ */
let last=performance.now()/1000,acc=0;
function loop(nowMs){
  const now=nowMs/1000;let frame=Math.min(.25,now-last);last=now;acc+=frame;
  while(acc>=CONFIG.FIXED_DT){update(CONFIG.FIXED_DT);acc-=CONFIG.FIXED_DT;}
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
